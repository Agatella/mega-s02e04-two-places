name: job-2 voice-to-memo

on:
  workflow_dispatch:
    inputs:
      url:
        description: The job-2 MCP URL (keep secret; set via -f url=...).
        required: true
      clip:
        description: The clip URL the job gave us.
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Show env and files
        run: |
          echo "pwd: $(pwd)"
          node --version
          ls -la src/
      - name: Run job 2
        env:
          JOB_URL: ${{ inputs.url }}
          JOB_CLIP: ${{ inputs.clip }}
        run: |
          set +e
          mkdir -p .out
          echo "=== starting node ==="
          node src/run-job.mjs --job 2 --url "$JOB_URL" --clip "$JOB_CLIP" \
            > .out/job-2.json 2> .out/job-2.err
          EC=$?
          echo "=== node exit code: $EC ==="
          echo "=== .out listing ==="
          ls -la .out || true
          echo "=== stderr ==="
          cat .out/job-2.err 2>/dev/null || echo "(no stderr file)"
          echo "=== stdout ==="
          cat .out/job-2.json 2>/dev/null || echo "(no stdout file)"
          # keep step successful so artifact upload runs and we can read everything
          exit 0
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-2-output
          path: |
            .out/*
          if-no-files-found: ignore
